<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat++ Create account</title>
    <!-- shared theme from the sign in page, plus the extra styles for this page -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/black-screen.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/new_account.css') }}">
</head>
<body>
    <img src="{{ url_for('static', filename='icon.png') }}" alt="Chat++ logo" class="side-icon">

    <main class="page">
        <div class="container">
            <div class="logo">Chat<span>++</span></div>

            <!-- Sign up form -->
            <section id="formView">
                <h1>Create account</h1>
                <p class="subtitle">Join Chat++ in a few seconds</p>

                <form id="signupForm" novalidate>
                    <div class="inputbox" id="nameBox">
                        <input type="text" id="name" name="name" placeholder=" " autocomplete="off" required>
                        <label for="name">Name</label>
                    </div>
                    <div class="field-error" id="nameError"></div>

                    <div class="inputbox" id="emailBox">
                        <input type="email" id="email" name="email" placeholder=" " autocomplete="off" required>
                        <label for="email">Email</label>
                    </div>
                    <div class="field-error" id="emailError"></div>

                    <div class="inputbox" id="passwordBox">
                        <input type="password" id="password" name="password" placeholder=" " autocomplete="off" required>
                        <label for="password">Password</label>
                        <button type="button" class="toggle-pw" data-target="password" aria-label="Show password">Show</button>
                    </div>
                    <div class="field-hint" id="passwordHint">At least 8 characters</div>
                    <div class="field-error" id="passwordError"></div>

                    <div class="inputbox" id="confirmBox">
                        <input type="password" id="confirm" name="confirm" placeholder=" " autocomplete="off" required>
                        <label for="confirm">Confirm password</label>
                        <button type="button" class="toggle-pw" data-target="confirm" aria-label="Show confirm password">Show</button>
                    </div>
                    <div class="field-error" id="confirmError"></div>

                    <div class="form-error" id="formError" role="alert"></div>
                    <input type="submit" value="Create account" id="createBtn">
                </form>

                <p class="footer-text">Already have an account? <a href="/signin">Sign in</a></p>
            </section>

            <!-- Step 2: enter the code that was emailed (hidden until the code is sent) -->
            <section id="otpView" hidden>
                <h1>Verify your email</h1>
                <p class="subtitle">We sent a 6-digit code to <strong id="otpEmail"></strong>. It expires in 5 minutes.</p>

                <form id="otpForm" novalidate>
                    <div class="inputbox" id="otpBox">
                        <input type="text" id="otp" name="otp" placeholder=" " autocomplete="one-time-code" inputmode="numeric" maxlength="6" required>
                        <label for="otp">6-digit code</label>
                    </div>
                    <div class="field-error" id="otpError" role="alert"></div>
                    <div class="otp-info" id="otpInfo"></div>
                    <input type="submit" value="Verify and create account" id="verifyBtn">
                </form>

                <div class="otp-actions">
                    <button type="button" class="link-btn" id="resendBtn">Resend code</button>
                    <button type="button" class="link-btn" id="changeEmailBtn">Change email</button>
                </div>
            </section>

            <!-- Success message (hidden until the account is created) -->
            <section id="successView" hidden>
                <div class="success-icon" aria-hidden="true">&#10003;</div>
                <h1>Account created</h1>
                <p class="subtitle">Welcome, <strong id="successName"></strong>. Your account is ready, so you can sign in now.</p>
                <a class="signin-link" href="/signin">Go to sign in</a>
            </section>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/new_account.js') }}"></script>
</body>
</html>
