<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set New Password | Chat++</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/new-password.css') }}">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <div class="password-container">

        <div class="logo">
            <h1>Chat<span>++</span></h1>
            <p>YOUR AI ASSISTANT</p>
        </div>

        <div class="lock-icon">
            🔐
        </div>

        <h2>Set New Password</h2>

        <p class="description">
            Create a new password for your account.
            Make sure it's strong and secure.
        </p>

        <form id="passwordForm" method="POST" action="#">

            <!-- New Password -->
            <div class="input-group">

                <label for="password">New Password</label>

                <div class="password-input">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        required
                        minlength="8"
                    >

                    <button type="button" class="toggle-password" data-target="password">
                        👁
                    </button>

                </div>

            </div>

            <!-- Password Strength -->
            <div class="strength-container">

                <div class="strength-bar">
                    <span id="strengthBar"></span>
                </div>

                <p id="strengthText">Password strength</p>

            </div>


            <!-- Confirm Password -->
            <div class="input-group">

                <label for="confirmPassword">Confirm New Password</label>

                <div class="password-input">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        required
                        minlength="8"
                    >

                    <button type="button" class="toggle-password" data-target="confirmPassword">
                        👁
                    </button>

                </div>

                <p id="matchMessage"></p>

            </div>

            <div id="changeDone" style="color:rgb(21, 247, 0); font-size: 14px;"></div>
            <button type="submit" class="submit-btn" id="submitBtn">
                Reset Password
                <span>→</span>
            </button>

        </form>

        <div class="back-link">
            <a href="/signin">← Back to Login</a>
        </div>

        <div class="footer">
            © 2026 Chat++. All rights reserved.
        </div>

    </div>


    <script>

        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");

        const matchMessage = document.getElementById("matchMessage");
        const strengthBar = document.getElementById("strengthBar");
        const strengthText = document.getElementById("strengthText");

        const submitBtn = document.getElementById("submitBtn");
        const passwordForm = document.getElementById("passwordForm");


        // Show / Hide Password
        document.querySelectorAll(".toggle-password").forEach(button => {

            button.addEventListener("click", () => {

                const target = document.getElementById(button.dataset.target);

                if (target.type === "password") {
                    target.type = "text";
                    button.textContent = "🙈";
                } else {
                    target.type = "password";
                    button.textContent = "👁";
                }

            });

        });


        // Password Strength
        password.addEventListener("input", () => {

            const value = password.value;

            let score = 0;

            if (value.length >= 8) score++;
            if (/[A-Z]/.test(value)) score++;
            if (/[a-z]/.test(value)) score++;
            if (/[0-9]/.test(value)) score++;
            if (/[^A-Za-z0-9]/.test(value)) score++;

            const levels = [
                { width: "0%", text: "Password strength", color: "transparent" },
                { width: "20%", text: "Very Weak", color: "#ef4444" },
                { width: "40%", text: "Weak", color: "#f97316" },
                { width: "60%", text: "Medium", color: "#eab308" },
                { width: "80%", text: "Strong", color: "#22c55e" },
                { width: "100%", text: "Very Strong", color: "#16a34a" }
            ];

            const level = levels[value.length === 0 ? 0 : score];

            strengthBar.style.width = level.width;
            strengthBar.style.backgroundColor = level.color;
            strengthText.textContent = level.text;

        });


        // Confirm Password Validation
        function checkPasswordMatch() {

            if (confirmPassword.value === "") {
                matchMessage.textContent = "";
                matchMessage.className = "";
                return false;
            }

            if (password.value === confirmPassword.value) {

                matchMessage.textContent = "✓ Passwords match";
                matchMessage.className = "success-message";

                return true;

            } else {

                matchMessage.textContent = "✕ Passwords do not match";
                matchMessage.className = "error-message";

                return false;

            }

        }

        password.addEventListener("input", checkPasswordMatch);
        confirmPassword.addEventListener("input", checkPasswordMatch);


        // Form Validation
        passwordForm.addEventListener("submit", (event) => {

            if (password.value.length < 8) {

                event.preventDefault();
                alert("Password must contain at least 8 characters.");

                return;

            }

            if (password.value !== confirmPassword.value) {

                event.preventDefault();
                alert("Passwords do not match!");

                return;

            }

        });

        passwordForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (password.value.length < 8) {
                alert("Password must contain at least 8 characters.");
                return;
            }
            if (password.value !== confirmPassword.value) {
                alert("Passwords do not match!");
                return;
            }
            const new_psw = password.value;
            try {
                const res = await fetch("/update_password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: new_psw
                    })
                });

                const data = await res.json();

                // green text when it worked, red text when it did not
                const box = document.getElementById("changeDone");
                box.style.color = data.ok ? "rgb(21, 247, 0)" : "rgb(250, 15, 15)";
                box.innerText = data.message || (data.ok ? "Password changed." : "Could not change the password.");

            } catch (error) {
                console.error(error);
                alert("Something went wrong. Please try again.");
            }

        });

    </script>

</body>
</html>
