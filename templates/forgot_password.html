<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Chat++</title>
    <!--<link rel="stylesheet" href="{{ url_for('static', filename='css/forgot-password.css') }}"> -->
    <link rel="stylesheet" href="../static/css/forgot-password.css">
</head>
<body>
    <main class="reset-page">
        <section class="reset-card" aria-labelledby="resetTitle">
            <a class="brand" href="/" aria-label="Chat++ home">
                <!--<img
                    class="brand-logo"
                    src="{{ url_for('static', filename='icon.png') }}"
                    alt="Chat++ logo"
                > -->
                <img
                    class="brand-logo"
                    src="../static/icon.png"
                    alt="Chat++ logo"
                >
                <span class="brand-name">Chat<span>++</span></span>
            </a>

            <div class="reset-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M7 10V7.5a5 5 0 0 1 10 0V10" />
                    <rect x="4.5" y="10" width="15" height="11" rx="2.5" />
                    <path d="M12 14.2v2.6" />
                </svg>
            </div>

            <h1 id="resetTitle">Forgot your password?</h1>
            <p class="intro">
                Enter the email address linked to your account
                and we'll send you a OTP number to your email.
            </p>

            <!-- Connect this form to your Flask password-reset endpoint. -->
            <form class="reset-form">
                <label for="email">Email address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
                <div id="emailDone" style="color:rgb(21, 247, 0); font-size: 14px;"></div>
                <div id="senterror" style="color:rgb(250, 15, 15); font-size: 14px;"></div>
                <button type="submit" class="reset-button" id="otp-send">
                    Send OTP
                    <span aria-hidden="true">→</span>
                </button>
            </form><br>
            <form class="otpinput" method="POST" action="#">
                <label for="otp">OTP</label>
                <input id="otp" name="otp" type="number" placeholder="OTP" required>
                <div id="otpDone" style="color:rgb(21, 247, 0); font-size: 14px;"></div>
                <div id="otperror" style="color:rgb(250, 15, 15); font-size: 14px;"></div>
                <button type="submit" class="otp-button" id="otp-button">
                    Done
                    <span aria-hidden="true">→</span>
                </button>
            </form>
            <p class="back-link">
                Remember your password?
                <a href="/signin">Back to sign in</a>
            </p>

            <p class="security-note">
                <span aria-hidden="true">✦</span>
                Your account security matters to us.
            </p>
        </section>
    </main>
<script src="{{ url_for('static', filename='js/forgotpsw.js') }}"></script>
</body>
</html>
